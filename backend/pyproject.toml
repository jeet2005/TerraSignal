[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terrasignal-backend"
version = "0.1.0"
description = "TerraSignal Backend - Real-time global event monitoring platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "sqlalchemy==2.0.25",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "redis==5.0.1",
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "pydantic-extra-types==2.4.3",
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.6",
    "httpx==0.26.0",
    "aiohttp==3.9.1",
    "aiohttp-socks==0.8.1",
    "apscheduler==3.10.4",
    "apscheduler[asyncio]==3.10.4",
    "python-dotenv==1.0.0",
    "pytz==2023.3",
    "python-dateutil==2.8.2",
    "geopy==2.4.1",
    "geojson==3.1.0",
    "shapely==2.0.1",
    "pyproj==3.6.1",
    "numpy==1.26.3",
    "pandas==2.1.4",
    "scipy==1.11.4",
    "scikit-learn==1.3.2",
    "scipy==1.11.4",
    "prometheus-client==0.19.0",
    "structlog==24.1.0",
    "python-json-logger==2.0.7",
    "watchfiles==0.21.0",
    "email-validator==2.1.0.post1",
    "tenacity==8.2.3",
    "httpx[socks]==0.26.0",
    "feedparser==6.0.10",
    "lxml==4.9.3",
    "beautifulsoup4==4.12.2",
    "dateparser==1.2.0",
    "pytz-deprecation-shim==0.1.0.post0",
    "tzdata==2023.3",
    "click==8.1.7",
    "rich==13.7.0",
    "typer==0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.4",
    "pytest-asyncio==0.23.3",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "httpx==0.26.0",
    "faker==21.2.0",
    "factory-boy==3.3.0",
    "ruff==0.1.15",
    "mypy==1.7.1",
    "pre-commit==3.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "B", "C4", "W"]
ignore = ["E501", "B008", "C901"]
exclude = [".venv", ".git", "__pycache__", "build", "dist"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "raise AssertionError", "raise NotImplementedError"]